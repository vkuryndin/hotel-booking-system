server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # No CORS changes needed: React and /api share one external origin.
    location /api/ {
        # Keep the original /api/... path (no trailing slash on proxy_pass).
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not accept security headers supplied by a browser.
        proxy_set_header X-Gateway-Internal-Secret "";
        proxy_set_header X-Verified-Client-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
