server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    loadbalancer:
      cache:
        enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**,/api/users/**

eureka:
  client:
    registry-fetch-interval-seconds: 2
    service-url:
      defaultZone: http://localhost:8761/eureka/