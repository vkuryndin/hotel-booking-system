server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**,/api/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/