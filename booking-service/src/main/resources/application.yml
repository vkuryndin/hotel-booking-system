server:
  port: 8081

spring:
  application:
    name: booking-service

  cloud:
    loadbalancer:
      cache:
        enabled: false
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
        disable-thread-pool: true

  datasource:
    url: jdbc:h2:mem:bookingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

eureka:
  client:
    registry-fetch-interval-seconds: 2
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.hotelbooking: INFO
  pattern:
    level: "%5p [traceId=%X{traceId}]"

app:
  jwt:
    issuer: hotel-booking
    access-token-ttl: PT1H
    keystore:
      path: ${JWT_KEYSTORE_PATH}
      password: ${JWT_KEYSTORE_PASSWORD}
      alias: jwt-signing
    service-keystore:
      path: ${SERVICE_JWT_KEYSTORE_PATH}
      password: ${SERVICE_JWT_KEYSTORE_PASSWORD}
      alias: service-jwt-signing
  rate-limit:
    # In-memory, per Booking Service instance; behind a trusted proxy prefer gateway-level IP limiting.
    login-per-minute: 20
    registration-per-hour: 5
